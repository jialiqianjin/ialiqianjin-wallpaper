<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEWbU5qRMgEVWpbgKvp-9X8Q9clpY7pOQAC1i0AAgNwKVY7gGNL3x6WEzwE.jpg" type="image/jpeg">
    <title>个人博客（jialiqianjin）</title>
    <meta name="description" content="jialiqianjin 个人主页 | 壁纸收藏 · 实用工具 · 游戏资源">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: transparent;
            background-image:
                linear-gradient(rgba(20, 22, 37, 0.55), rgba(20, 22, 37, 0.55)),
                url("https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEWxBNqTNXHGEBuIpFd1r0I7gbkkdW_lgACfyYAAkj5YVZRotD8WhhF5jwE.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e4e7f5;
            min-height: 100vh;
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 2rem 1.2rem;
        }
        /* 顶端横向导航 */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 3rem;
            padding: 12px 16px;
            border-radius: 999px;
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 0.08);
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        .nav-btn {
            padding: 10px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: #d0d8f0;
            cursor: pointer;
            transition: 0.25s;
        }
        .nav-btn.active {
            background: rgba(40, 80, 160, 0.3);
            color: #fff;
        }
        .nav-btn:hover {
            background: rgba(22, 30, 48, 0.8);
        }
        /* 首页整体布局 */
        .home-wrap {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        /* 欢迎卡片 */
        .user-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 460px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            cursor: default;
        }
        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(60, 120, 200, 0.3);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .greeting h2 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #e2e8ff;
            text-align: center;
            letter-spacing: 1px;
        }
        /* 波纹动画 */
        @keyframes rippleSpread {
            to { transform: scale(2.5); opacity: 0; }
        }
        .ripple-box {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        /* 时间+音乐并排 */
        .row-two-card {
            display: flex;
            gap: 2rem;
            width: 100%;
        }
        .col-half {
            width: 50%;
        }
        .time-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .time-box {
            text-align: center;
        }
        .time-text {
            font-size: 2rem;
            font-weight 700;
            color: #d8e1ff;
            text-shadow: 0 0 18px rgba(60, 120, 200, 0.3);
        }
        .date-text {
            font-size: 0.9rem;
            color: #9aa2c2;
            margin-top: 6px;
        }
        .mini-music-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .music-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .music-cover {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .music-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .music-info {
            flex: 1;
            overflow: hidden;
        }
        .music-name {
            font-size: 1rem;
            color: #e2e8ff;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .music-artist {
            font-size: 0.82rem;
            color: #9aa2c2;
            margin-top: 4px;
        }
        .progress-wrap {
            width: 100%;
            height: 5px;
            background: rgba(255,255,0.12);
            border-radius: 99px;
            cursor: pointer;
            position: relative;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#4088dd,#6394ff);
            border-radius: 99px;
        }
        .music-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #9aa2c2;
        }
        .music-control {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 14px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #d0d8f0;
            font-size: 1.3rem;
            cursor: pointer;
        }
        .music-set-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .music-set-card h3 {
            margin-bottom: 20px;
            color: #e2e8ff;
        }
        .song-item {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,0.05);
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-item:hover {
            background: rgba(40, 80, 160, 0.2);
        }
        .song-item.active {
            background: rgba(40, 80, 0.25);
        }
        .loop-box {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .loop-box label {
            cursor: pointer;
        }
        .module {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .module.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tool-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            max-width: 600px;
            margin: 0 auto 32px auto;
            text-align: center;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .tool-card:hover {
            border-color: rgba(255, 255, 0.13);
            background: rgba(22, 30, 48, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .tool-card h3 {
            font-size: 1.45rem;
            margin-bottom: 14px;
            color: #d8e1ff;
            font-weight: 550;
        }
        .tool-card p {
            color: #9aa2c2;
            margin-bottom: 16px;
        }
        .download-exe {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 30px;
            background: linear-gradient(120deg, #406fc8, #4f62b3);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: 450;
        }
        .download-exe:hover {
            opacity: 0.93;
            transform: translateY(-2px);
            box-shadow: 0 4px 18px rgba(60, 120, 200, 0.35);
        }
        .tool-bar {
            text-align: center;
            margin-bottom: 2.5rem;
            gap: 12px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 8px 22px;
            background: rgba(22, 30, 48, 0.62);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 8px;
            color: #d0d8f0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tool-btn:hover {
            background: rgba(22, 30, 48, 0.8);
        }
        #import-file {
            display: none;
        }
        .add-link-box {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 2.2rem;
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
            overflow: hidden;
        }
        #linkInput {
            width: 100%;
            max-width: 850px;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 0.12);
            background: rgba(0, 0, 0, 0.18);
            color: #e0e4ff;
            font-size: 15px;
            outline: none;
        }
        #addTempBtn {
            margin-top: 14px;
            padding: 11px 30px;
            background: rgba(40, 80, 160, 0.18);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 12px;
            color: #d0d8ff;
            cursor: pointer;
            font-size: 1rem;
        }
        .wall-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 30px;
        }
        .wall-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .wall-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 0.13);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .wall-card img, .wall-card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .wall-card video {
            background: #0b0c15;
        }
        .card-action {
            padding: 18px;
            text-align: center;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .down-btn {
            padding: 8px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.88rem;
            background: linear-gradient(120deg, #406fc8, #4f62b3);
        }
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #868fb0;
            padding: 4rem 0;
        }
        .preview-mask {
            position: fixed;
            top: 0;
            left: 0;
            width 100vw;
            height: 100vh;
            background: rgba(10, 11, 20, 0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-mask img, .preview-mask video {
            max-width: 92%;
            max-height: 92%;
            object-fit: contain;
        }
        .close-preview {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 2.3rem;
            color: #d0d8ff;
            cursor: pointer;
            opacity: 0.7;
        }
        .login-mask {
            position: fixed;
            inset: 0;
            background: rgba(10, 11, 20, 0.97);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(28, 30, 42, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 42px 32px;
            text-align: center;
        }
        .login-box h2 {
            font-size: 1.85rem;
            color: #d8e0ff;
            margin-bottom: 26px;
            letter-spacing: 2px;
        }
        #pwdInput {
            width: 100%;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 0.12);
            background: rgba(0, 0, 0, 0.22);
            color: #e0e4ff;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }
        #loginBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(120deg, #406fc8, #4f62b3);
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
            position: relative;
            z-index: 99999;
        }
        .login-t {
            color: #ffadb6;
            font-size: 14px;
            height: 22px;
            margin-bottom: 12px;
        }
        .main-wrap {
            display: none;
        }
        .logout-box {
            text-align: center;
            margin-bottom: 2rem;
        }
        #logoutBtn {
            padding: 8px 20px;
            background: rgba(22, 30, 48, 0.62);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 8px;
            color: #c5cceb;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #logoutBtn:hover {
            background: rgba(22, 30, 48, 0.8);
            border-color: rgba(255, 255, 0.13);
        }
        /* AI对话模块 气泡 */
        .ai-chat-card {
            background: rgba(22, 30, 48, 0.62);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            max-width: 800px;
            margin: 0 auto;
        }
        .chat-log {
            height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .chat-log::-webkit-scrollbar{
            width:6px;
        }
        .chat-log::-webkit-scrollbar-thumb{
            background:rgba(255,255,0.18);
            border-radius:3px;
        }
        .chat-item {
            margin:12px 0;
            display:flex;
        }
        .user-text {
            justify-content: flex-end;
        }
        .ai-text {
            justify-content: flex-start;
        }
        .msg-box {
            max-width:85%;
            padding:10px 14px;
            line-height:1.55;
        }
        .user-text .msg-box{
            background: rgba(70, 130, 220, 0.32);
            border: 1px solid rgba(120, 180, 255, 0.25);
            border-radius: 14px 14px 4px 14px;
            color:#e0edff;
        }
        .ai-text .msg-box{
            background: rgba(60, 90, 150, 0.28);
            border: 1px solid rgba(120, 160, 230, 0.22);
            border-radius: 14px 14px 14px 4px;
            color:#e4ddf7;
        }
        .chat-input-box {
            display: flex;
            gap:12px;
            align-items: center;
        }
        #chatInput {
            flex:1;
            padding:14px 18px;
            border-radius:12px;
            border:1px solid rgba(255,255,0.12);
            background:rgba(0,0,0.18);
            color:#e0e4ff;
            outline:none;
        }
        .chat-sub-buttons {
            display: flex;
            gap:10px;
        }
        .chat-btn {
            padding:0 16px;
            border:none;
            border-radius:12px;
            background: linear-gradient(120deg, #406fc8, #4f62b3);
            color:#fff;
            cursor:pointer;
            height:46px;
        }
        .chat-btn:hover{
            opacity:0.9;
        }
        #imgUploadInput {
            display: none;
        }
        .preview-img-small {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
            margin: 6px 0;
        }
        /* 废弃远程相关样式隐藏 */
        .remote-auth-mask, .remote-module {
            display: none !important;
    </style>
</head>
<body>
    <!-- 废弃远程弹窗 保留但隐藏 -->
    <div class="remote-auth-mask" id="remoteAuthMask">
        <div class="remote-auth-box">
            <h3>远程操控验证</h3>
            <div class="remote-tip" id="remoteTip"></div>
            <input type="password" id="remotePwdInput" placeholder="请输入远程操控密码">
            <div class="remote-btn-group">
                <button class="remote-sub-btn" id="remoteCancelBtn">取消</button>
                <button class="remote-sub-btn" id="remoteConfirmBtn">验证进入</button>
            </div>
        </div>
    </div>
    <!-- 网站登录弹窗 -->
    <div class="login-mask" id="loginMask">
        <div class="login-box">
            <h2>个人博客 验证登录</h2>
            <div class="login-t" id="loginTip"></div>
            <input type="password" id="pwdInput" placeholder="请输入访问密码">
            <button id="loginBtn">确认登录</button>
        </div>
    </div>
    <div class="main-wrap" id="mainWrap">
        <div class="container">
            <!-- 导航栏（删除极域、游戏、远程按钮） -->
            <div class="nav-bar">
                <button class="nav-btn" data-target="homeModule">首页</button>
                <button class="nav-btn" data-target="wallModule">壁纸</button>
                <button class="nav-btn" data-target="musicModule">音乐</button>
                <button class="nav-btn" data-target="aiChatModule">AI对话</button>
                <button class="nav-btn" data-target="cloudModule">云盘</button>
            </div>
            <div class="logout-box">
                <button id="logoutBtn">退出登录</button>
            </div>
            <!-- 首页模块 完整保留 -->
            <div class="module show" id="homeModule">
                <div class="home-wrap">
                    <div class="user-card">
                        <div class="avatar">
                            <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEWbU5qRMgEVWpbgKvp-9X8Q9clpY7pOQAC1i0AAgNwKVY7gGNL3x6WEzwE.jpg" alt="个人头像">
                        </div>
                        <div class="greeting">
                            <h2>欢迎回来，加力前进</h2>
                        </div>
                    </div>
                    <div class="row-two-card">
                        <div class="col-half">
                            <div class="time-card ripple-box">
                                <div class="time-box">
                                    <div class="time-text" id="timeText">00:00</div>
                                    <div class="date-text" id="dateText">2026年07月24日 星期五</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-half">
                            <div class="mini-music-card ripple-box">
                                <div class="music-top">
                                    <div class="music-cover">
                                        <img id="miniCover" src="" alt="歌曲封面">
                                    </div>
                                    <div class="music-info">
                                        <div class="music-name" id="miniName">暂无歌曲</div>
                                        <div class="music-artist" id="miniArtist">—</div>
                                    </div>
                                </div>
                                <div class="progress-wrap" id="progressBarWrap">
                                    <div class="progress-bar" id="progressBar"></div>
                                </div>
                                <div class="music-time">
                                    <span id="curTime">00:00</span>
                                    <span id="totalTime">00:00</span>
                                </div>
                                <div class="music-control">
                                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                                    <button class="ctrl-btn" id="playBtn">▶</button>
                                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div style="text-align:center;padding:4rem 0;color:#a8adc8;font-size:1.2rem;">
                        欢迎进入个人博客，可在上方导航栏切换功能
                    </div>
                </div>
            </div>
            <!-- 壁纸模块 完整保留 -->
            <div class="module" id="wallModule">
                <div class="tool-bar">
                    <button class="tool-btn" id="exportBtn">导出全部链接JSON</button>
                    <input type="file" id="import-file" accept=".json">
                </div>
                <div class="add-link-box ripple-box">
                    <input id="linkInput" placeholder="临时添加图片/视频（换设备消失，永久需写进代码）">
                    <br>
                    <button id="addTempBtn">临时添加（本地缓存）</button>
                    <p style="color:#868fb0;margin-top:8px;font-size:13px;">⚠️ 想要换设备也显示，必须把链接加到fixed数组，重新上传页面</p>
                </div>
                <div class="wall-grid" id="wallGrid"></div>
            </div>
            <!-- 音乐模块 完整保留 -->
            <div class="module" id="musicModule">
                <div class="music-set-card ripple-box">

                        <label for="loopCheck">开启单曲循环</label>

            <!-- AI对话模块 完整保留 -->
            <div class="module" id="aiChatModule">
                <div class="ai-chat-card ripple-box">
                    <h3 style="text-align:center;margin-bottom:20px;color:#e2e8ff;">AI智能对话 · 支持图文识图</h3>
                    <div class="chat-log" id="chatLog"></div>
                    <input type="file" id="imgUploadInput" accept="image/*">
                    <div class="chat-input-box">
                        <input type="text" id="chatInput" placeholder="输入问题，上传图片可识图">
                        <div class="chat-sub-buttons">
                            <button class="chat-btn" id="uploadImgBtn">上传图片</button>
                            <button class="chat-btn" id="sendChatBtn">发送</button>

                    <div id="previewImgBox"></div>
                </div>
            </div>
            <!-- 云盘模块 完整保留 -->
            <div class="module" id="cloudModule">
                <div class="tool-card ripple-box">
                    <h3>我的云盘</h3>
                    <p>通过内网穿透访问平板云盘服务</p>
                    <a class="download-exe" href="http://700b5e2ab48a.ofalias.net:56969" target="_blank">立即打开云盘</a>
                </div>
            </div>
            <!-- 已删除：极域反杀模块、游戏模块、远程模块 -->
        </div>
    </div>
    <!-- 大图预览弹窗 -->
    <div class="preview-mask" id="previewMask">
        <span class="close-preview" id="closePreview">×</span>
        <img id="previewImg" style="display:none;">
        <video id="previewVideo" controls style="display:none;"></video>
    </div>
    <script>
        window.onerror = function(msg,src,line){
            console.error("JS错误：",msg,src,line);
            const tipDom = document.getElementById("loginTip");
            if(tipDom) tip.textContent = "页面脚本异常";
        };
        window.onload = function(){
            const ACCESS_PASSWORD = "a12345678945";
            const LOGIN_STORAGE_KEY = "wallLoginAuth";
            // 仅修改此处API域名，其余完全不变
            const API_BASE = "https://api-dc6d38b3.fastapicloud.dev";
            const API_TOKEN = "a12345678945";
            let chatHistory = [];
            let uploadImageFile = null;
            // 远程相关废弃变量保留兼容
            let remoteAuthPass = false;
            let liveRunning = false;
            let pollTimer = null;
            const musicList = [
                {name: "歌曲名称1",artist: "歌手名",cover: "https://via.placeholder.com/100",src: "#"},
                {name: "歌曲名称2",artist: "歌手名",cover: "https://via.placeholder.com/100",src: "#"}
            ];
            let currentIndex = 0;
            let isLoop = false;
            const audio = new Audio();
            const fixedImages = [
                "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEVse9qM3ZwqHjkQCkkZS2xCvMavSz70QACFiMAAoLBoVXyysCgPKPgXTwE.jpg",
                "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEVsgRqM3jGTgnr3syb7ztuclcHt35fSgACMCMAAoLBoVXG6YvfK6qc6TwE.png",
                "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEVsjFqM30AAXyA1uSlDvi_HxgRK_BoRM0AAnQjAAKCwaFVfapo5nroNFs8BA.png",
                "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEVwBdqNM_f6WSiZ9ZqyWp99HA1qvkP9gACmyAAAmzbqFXqtxyKJyeGUjwE.png",
                "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEV0RJqN4aVBGoLRDwwc4cAAR-bnhWz37EAAs4jAALn07lVJaP7ROcLZDw8BA.png",
                "https://cropgif.net/videos/1782022932124-66a03516-a7e6-4d51-adc9-ab4ae0923174.mp4",
                "https://cropgif.net/videos/1782023395596-f40b26d1-fcf6-4a84-bb91-19fcdcfdd61f.mp4"
            ];
            // 时间更新
            function updateTime(){
                const now = new Date();
                const h = String(now.getHours()).padStart(2,'0');
                const m = String(now.getMinutes()).padStart(2,'0');
                const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                document.getElementById('timeText').textContent = `${h}:${m}`;
                document.getElementById('dateText').textContent = `${now.getFullYear()}年${now.getMonth()+1}日 ${week[now.getDay()]}`;
            }
            updateTime();
            setInterval(updateTime, 1000);
            // 登录逻辑 完全保留
            const loginMask = document.getElementById("loginMask");
            const mainWrap = document.getElementById("mainWrap");
            const pwdInput = document.getElementById("pwdInput");
            const loginBtn = document.getElementById("loginBtn");
            const loginTip = document.getElementById("loginTip");
            const logoutBtn = document.getElementById("logoutBtn");
            function checkLogin(){
                try{
                    if(localStorage.getItem(LOGIN_STORAGE_KEY) === "ok"){
                        loginMask.style.display = "none";
                        mainWrap.style.display = "block";
                        renderWall();
                        renderSongList();
                    }else{
                        loginMask.style.display = "flex";
                        mainWrap.style.display = "none";
                    }
                }catch(e){
                    loginTip.textContent = "本地存储异常，请清除缓存";
                }
            }
            function doLogin(){
                loginTip.textContent = "";
                const inputPwd = pwdInput.value.trim();
                if(inputPwd !== ACCESS_PASSWORD){
                    loginTip.textContent = "密码错误，请重新输入";
                    pwdInput.value = "";
                    return;
                }
                localStorage.setItem(LOGIN_STORAGE_KEY, "ok");
                checkLogin();
            }
            function doLogout(){
                localStorage.removeItem(LOGIN_STORAGE_KEY);
                checkLogin();
            }
            loginBtn.onclick = doLogin;
            pwdInput.onkeydown = function(e){
                if(e.key === "Enter") doLogin();
            };
            logoutBtn.onclick = doLogout;
            // 壁纸渲染 完整保留
            const wallGrid = document.getElementById('wallGrid');
            const previewMask = document.getElementById('previewMask');
            const previewImg = document.getElementById('previewImg');
            const previewVideo = document.getElementById('previewVideo');
            const closePreview = document.getElementById('closePreview');
            const exportBtn = document.getElementById('exportBtn');
            const linkInput = document.getElementById('linkInput');
            const addTempBtn = document.getElementById('addTempBtn');
            let tempList = [];
            try{
                tempList = JSON.parse(localStorage.getItem('tempWall')) || [];
            }catch(err){
                tempList = [];
            }
            function getMediaType(url){
                const ext = url.split('.').pop().toLowerCase();
                return ['jpg','jpeg','png','gif','webp','bmp'].includes(ext) ? "img" : "video";
            }
            function renderWall(){
                const all = [...fixedImages,...tempList];
                if(all.length === 0){
                    wallGrid.innerHTML = '<div class="empty">暂无壁纸资源</div>';
                    return;
                }
                let html = "";
                all.forEach(u=>{
                    const t = getMediaType(u);
                    if(t === "img"){
                        html += `<div class="wall-card ripple-box"><img class="preview-item" data-src="${u}" src="${u}"><div class="card-action"><a class="down-btn" target="_blank" href="${u}">下载原图</div></div>`;
                    }else{
                        html += `<div class="wall-card ripple-box"><video muted loop preload="metadata" class="preview-item" data-src="${u}"><source src="${u}"></video><div class="card-action"><a class="down-btn" target="_blank" href="${u}">下载视频</div></div>`;
                    }
                });
                wallGrid.innerHTML = html;
                bindPreview();
            }
            function bindPreview(){
                document.querySelectorAll('.preview-item').forEach(el=>{
                    el.onclick = function(){
                        const src = this.dataset.src;
                        const t = getMediaType(src);
                        previewImg.style.display = "none";
                        previewVideo.style.display = "none";
                        if(t === "img"){
                            previewImg.src = src;
                            previewImg.style.display = "block";
                        }else{
                            previewVideo.src = src;
                            previewVideo.style.display = "block";
                            previewVideo.play();
                        }
                    }
                })
            }
            closePreview.onclick = ()=>{
                previewMask.style.display = "none";
                previewVideo.pause();
            };
            previewMask.onclick = e=>{
                if(e.target === previewMask){
                    previewMask.style.display = "none";
                    previewVideo.pause();
                }
            }
            addTempBtn.onclick = ()=>{
                const val = linkInput.value.trim();
                if(!val) return alert("请输入链接");
                tempList.push(val);
                localStorage.setItem('tempWall', JSON.stringify(tempList));
                linkInput.value = "";
                renderWall();
            }
            exportBtn.onclick = ()=>{
                const allUrl = [...fixedImages,...tempList];
                const blob = new Blob([JSON.stringify(allUrl,null,2)],{type:"application/json"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "壁纸链接.json";
                a.click();
                URL.revokeObjectURL(a.href);
            }
            // 音乐播放 完整保留
            const miniCover = document.getElementById('miniCover');
            const miniName = document.getElementById('miniName');
            const miniArtist = document.getElementById('miniArtist');
            const progressWrap = document.getElementById('progressBarWrap');
            const progressBar = document.getElementById('progressBar');
            const curTime = document.getElementById('curTime');
            const totalTime = document.getElementById('totalTime');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const loopCheck = document.getElementById('loopCheck');
            const songListBox = document.getElementById('songListBox');
            function loadMusic(idx){
                if(!musicList[idx]) return;
                const s = musicList[idx];
                audio.src = s.src || "#";
                miniCover.src = s.cover || "https://via.placeholder.com/100";
                miniName.textContent = s.name || "暂无歌曲";
                miniArtist.textContent = s.artist || "未知歌手";
                currentIndex = idx;
                renderSongList();
            }
            function formatTime(s){
                const m = Math.floor(s / 60);
                const ss = Math.floor(s % 60);
                return String(m).padStart(2,'0') + ":" + String(ss).padStart(2,'0');
            }
            audio.ontimeupdate = ()=>{
                const p = audio.currentTime / audio.duration * 100;
                progressBar.style.width = p + "%";
                curTime.textContent = formatTime(audio.currentTime);
            }
            audio.onloadedmetadata = ()=> totalTime.textContent = formatTime(audio.duration);
            audio.onended = ()=>{
                if(isLoop){
                    audio.currentTime = 0;
                    audio.play();
                }else{
                    nextSong();
                }
            }
            playBtn.onclick = ()=>{
                if(audio.paused){
                    audio.play();
                    playBtn.textContent = "⏸";
                }else{
                    audio.pause();
                    playBtn.textContent = "▶";
                }
            }
            prevBtn.onclick = ()=>{
                currentIndex = (currentIndex - 1 + musicList.length) % musicList;
                loadMusic(currentIndex);
                audio.play();
                playBtn.textContent = "⏸";
            }
            function nextSong(){
                currentIndex = (currentIndex + 1) % musicList.length;
                loadMusic(currentIndex);
                audio.play();
                playBtn.textContent = "⏸";
            }
            nextBtn.onclick = nextSong;
            progressWrap.onclick = e=>{
                const rect = progressWrap.getBoundingClientRect();
                const per = (e.clientX - rect.left) / rect.width;
                audio.currentTime = per * audio.duration;
            }
            loopCheck.onchange = ()=> isLoop = loopCheck.checked;
            function renderSongList(){
                let html = "";
                musicList.forEach((item,i)=>{
                    html += `<div class="song-item" data-i="${i}">${item.name} - ${item.artist}</div>`;
                })
                songList.innerHTML = html;
                document.querySelectorAll('.song-item').forEach(el=>{
                    el.onclick = ()=>{
                        const idx = Number(el.dataset.i);
                        loadMusic(idx);
                        audio.play();
                        playBtn.textContent = "⏸";
                    }
                })
            }
            // AI对话 完整保留
            const chatLog = document.getElementById("chatLog");
            const chatInput = document.getElementById("chatInput");
            const sendChatBtn = document.getElementById("sendChatBtn");
            const uploadImgBtn = document.getElementById("uploadImgBtn");
            const imgUploadInput = document.getElementById("imgUploadInput");
            const previewImgBox = document.getElementById("previewImgBox");
            let loadingTipEl = null;
            uploadImgBtn.onclick = function() {
                imgUploadInput.click();
            };
            imgUploadInput.onchange = function(e){
                const file = e.target.files[0];
                if(!file) return;
                uploadImageFile = file;
                const reader = new FileReader();
                reader.onload = ev => {
                    previewImgBox.innerHTML = `<img class="preview-img-small" src="${ev.target.result}">`;
                }
                reader.readAsDataURL(file);
            }
            function addChat(text, isUser){
                const div = document.createElement("div");
                div.className = "chat-item " + (isUser ? "user-text" : "ai-text");
                div.innerHTML = `<div class="msg-box"><b>${isUser ? "你" : "AI"}：</b>${text}</div>`;
                chatLog.appendChild(div);
                if(chatLog){
                    chatLog.scrollTop = chatLog.scrollHeight;
                }
                return div;
            }
            async function sendAiMsg(){
                const text = chatInput.value.trim();
                if(!text && !uploadImageFile) {
                    alert("请输入提问或上传图片");
                    return;
                }
                if(text){
                    addChat(text, true);
                }
                chatInput.value = "";
                loadingTipEl = addChat("请求处理中，请稍候...", false);
                try{
                    let reply = "";
                    if(uploadImageFile){
                        const formData = new FormData();
                        formData.append("token", API_TOKEN);
                        formData.append("prompt", text);
                        formData.append("image", uploadImageFile);
                        const res = await fetch(`${API_BASE}/image_chat`,{
                            method:"POST",
                            body: formData
                        });
                        const data = await res.json();
                        if(loadingTipEl && loadingTipEl.parentNode) loadingTip.remove();
                        if(data.error){
                            reply = "错误：" + data.error;
                        }else if(data.choices && data.choices[0]?.message?.content){
                            reply = data.choices[0].message.content;
                        }else if(data.output?.text){
                            reply = data.output.text;
                        }else{
                            reply = JSON.stringify(data, null, 2);
                        }
                        uploadImageFile = null;
                        previewImgBox.innerHTML = "";
                    }else{
                        chatHistory.push({role:"user", content:text});
                        const postData = {
                            token: API_TOKEN,
                            messages: chatHistory
                        };
                        const res = await fetch(`${API_BASE}/v1/chat/completions`,{
                            method:"POST",
                            headers:{
                                "Content-Type":"application/json"
                            },
                            body: JSON.stringify(postData)
                        });
                        const data = await res.json();
                        if(loadingTipEl && loadingTipEl.parentNode) loadingTipEl.remove();
                        if(data.error){
                            reply = "错误：" + data.error;
                        }else if(data.choices && data.choices[0]?.message?.content){
                            reply = data.choices[0].message.content;
                        }else if(data.output?.text){
                            reply = data.output.text;
                        }else{
                            reply = JSON.stringify(data, null, 2);
                        }
                        chatHistory.push({role:"assistant", content:reply});
                    }
                    addChat(reply, false);
                }catch(err){
                    if(loadingTipEl && loadingTipEl.parentNode) loadingTipEl.remove();
                    addChat("网络请求失败：" + err.message, false);
                }
                loadingTipEl = null;
            }
            sendChatBtn.onclick = sendAiMsg;
            chatInput.onkeydown = e=>{
                if(e.key === "Enter") sendAiMsg();
            }
            // 水波纹 完整保留
            document.querySelectorAll('.ripple-box').forEach(card=>{
                card.addEventListener('click',function(e){
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const ripple = document.createElement('span');
                    ripple.style.position = "absolute";
                    ripple.style.borderRadius = "50%";
                    ripple.style.background = "rgba(60, 120, 200, 0.35)";
                    ripple.style.pointerEvents = "none";
                    ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + "px";
                    ripple.style.left = x + "px";
                    ripple.style.top = y + "px";
                    ripple.style.transform = "scale(0)";
                    ripple.style.opacity = "0.7";
                    ripple.style.animation = "rippleSpread 0.6s ease-out forwards";
                    this.appendChild(ripple);
                    setTimeout(()=>ripple.remove(),600);
                })
            })
            // 导航切换逻辑（已删除无用按钮，代码兼容）
            const navBtns = document.querySelectorAll('.nav-btn');
            const modules = document.querySelectorAll('.module');
            navBtns.forEach(btn=>{
                btn.addEventListener('click',()=>{
                    const targetId = btn.getAttribute("data-target");
                    navBtns.forEach(b=>b.classList.remove('active'));
                    modules.forEach(m=>m.classList.remove('show'));
                    btn.classList.add("active");
                    if(targetId){
                        document.getElementById(targetId).classList.add('show');
                    }
                    // 废弃远程变量兼容
                    if(target !== "remoteModule"){
                        liveRunning = false;
                        if(pollTimer){
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    }
                })
            })
            checkLogin();
        }
    </script>
